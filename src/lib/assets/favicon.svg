<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>JBC — Jimibello &amp; Co.</title>
	<!--
		Icon lockup on Dark Liver. At 16px the tagline is unreadable and the
		ampersand becomes a smudge, so the red is carried by a rule beneath the
		wordmark rather than by the type.
	-->
	<rect width="64" height="64" fill="#262626" />
	<text
		x="32"
		y="38"
		text-anchor="middle"
		fill="#ffffff"
		font-family="Raleway, 'Helvetica Neue', Arial, sans-serif"
		font-weight="700"
		font-size="26"
		textLength="44"
		lengthAdjust="spacingAndGlyphs">JBC</text
	>
	<rect x="10" y="46" width="44" height="4" fill="#d61b0c" />
</svg>